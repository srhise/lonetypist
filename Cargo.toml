[package]
name = "lonetypist"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
pixels = "0.17"
rfd = "0.17"
arboard = "3"
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = "debuginfo"  # keep symbol names so crash reports are readable
